<title>پنل مدیریت</title>
<style>
:root{--bg:#07070f;--fg:#f1f2ff;--mut:#a3a8cc;--a:#7c5cff;--b:#00e5c7;--c:#ff4fa3;--card:rgba(255,255,255,.045);--bd:rgba(255,255,255,.11);--err:#ff6b8a}
*{box-sizing:border-box;margin:0}

body:before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(40% 35% at 85% 5%,rgba(124,92,255,.22),transparent 70%),radial-gradient(35% 30% at 10% 90%,rgba(0,229,199,.12),transparent 70%),radial-gradient(30% 25% at 50% 50%,rgba(255,79,163,.05),transparent 70%)}
#app{position:relative;min-height:100vh}
#app>.lock{max-width:440px;width:calc(100% - 28px);margin:8vh auto 40px}
.lock{padding:26px!important;box-shadow:0 40px 90px -50px var(--a)}
.lock h1{margin-bottom:4px}

.logo{width:44px;height:44px;flex:none;display:grid;place-items:center;border-radius:14px;font:900 1rem 'Courier New',monospace;background:linear-gradient(135deg,var(--a),var(--c));box-shadow:0 10px 26px -10px var(--a)}
aside nav{display:flex;flex-direction:column;gap:4px}
.nv{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:14px;color:var(--mut);font-size:.95rem;transition:background .2s,color .2s}

.ic{display:inline-grid;place-items:center;flex:none}
.ic svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
main{min-width:0;width:100%;max-width:1000px;padding:0 30px 50px}
.top{position:sticky;top:0;z-index:20;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:18px 0 14px;background:linear-gradient(var(--bg) 78%,transparent)}
.top h1{font-size:1.4rem;font-weight:900;display:inline}
.pill{display:inline-block;margin-inline-start:12px;padding:1px 12px;border-radius:99px;font-size:.78rem;color:var(--c);background:rgba(255,79,163,.12);border:1px solid rgba(255,79,163,.35)}

.actions{display:flex;gap:8px;align-items:center}

h2{font-size:1.05rem;margin-bottom:12px;display:flex;align-items:center;gap:8px}
h2:before{content:"";width:4px;height:18px;border-radius:9px;background:linear-gradient(var(--a),var(--b))}
.sub{color:var(--mut);font-size:.88rem;margin-bottom:14px}
label{display:block;font-size:.84rem;color:var(--mut);margin:14px 0 5px}
input,textarea,select{width:100%;font:inherit;color:var(--fg);background:rgba(255,255,255,.055);border:1px solid var(--bd);border-radius:13px;padding:10px 13px;outline:none;transition:border-color .2s,box-shadow .2s,background .2s}

textarea{min-height:120px;resize:vertical}

button{font:inherit;cursor:pointer;border:0;border-radius:13px;padding:10px 18px;color:#fff;background:linear-gradient(135deg,var(--a),var(--c));font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .15s,filter .2s,opacity .2s}

button.o,a.btn{background:var(--card);border:1px solid var(--bd);color:var(--fg);font-weight:500}
a.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border-radius:13px;text-decoration:none;font-size:1rem}
button.d{background:rgba(255,107,138,.14);border:1px solid rgba(255,107,138,.5);color:var(--err)}

.seg button.on{background:linear-gradient(135deg,var(--a),var(--b));color:#fff}
.item{border:1px solid var(--bd);border-radius:18px;padding:16px;margin-bottom:14px;background:rgba(255,255,255,.03);transition:border-color .2s}
.item:hover{border-color:rgba(124,92,255,.5)}
.item .head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;gap:8px;flex-wrap:wrap}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.lg{font:700 .72rem 'Courier New',monospace;color:var(--b);letter-spacing:.1em}
.photo{width:170px;aspect-ratio:4/5;object-fit:cover;border-radius:20px;border:1px solid var(--bd);display:block;background:#111;box-shadow:0 30px 60px -35px var(--a)}

.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:16px}
button.stat{flex-direction:column;align-items:flex-start;gap:2px;padding:16px;border-radius:20px;background:linear-gradient(160deg,rgba(124,92,255,.22),rgba(255,255,255,.03));border:1px solid var(--bd);color:var(--mut);font-weight:500;text-align:start}

button.stat:hover{border-color:var(--b)}
#toasts{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:60;display:flex;flex-direction:column;gap:8px;width:min(440px,calc(100% - 24px));pointer-events:none}
.toast{padding:12px 16px;border-radius:14px;background:rgba(20,20,42,.95);border:1px solid var(--bd);box-shadow:0 20px 50px -20px #000;font-size:.92rem;animation:tin .3s both}
.toast.ok{border-color:var(--b)}.toast.e{border-color:var(--err);color:var(--err)}

@media(max-width:820px){
 .shell{grid-template-columns:1fr}

@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
