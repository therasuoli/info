<style>

#app{position:relative;max-width:900px;margin:auto;padding:18px}
h1{font-size:1.4rem;font-weight:900}
h2{font-size:1.1rem;margin-bottom:12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:20px;margin-bottom:16px}
.lock{max-width:440px;margin:8vh auto 0}

input:focus,textarea:focus,select:focus{border-color:var(--b)}
select option{background:#14142a}
textarea{min-height:110px;resize:vertical}
.ltr{direction:ltr;text-align:left}
button{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:10px 18px;color:#fff;background:linear-gradient(135deg,var(--a),var(--c));font-weight:700}
button.o{background:var(--card);border:1px solid var(--bd)}
button.d{background:rgba(255,107,138,.18);border:1px solid var(--err);color:var(--err)}
button.sm{padding:5px 12px;font-size:.82rem}
button:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row>*{flex:0 0 auto}
.msg{margin-top:12px;font-size:.9rem;min-height:1.4em}
.msg.e{color:var(--err)}.msg.ok{color:var(--b)}
.bar{position:sticky;top:0;z-index:10;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:12px 0;background:linear-gradient(var(--bg) 70%,transparent)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 16px}
.tabs button{background:var(--card);border:1px solid var(--bd);padding:7px 16px;font-weight:500}
.tabs button.on{background:linear-gradient(135deg,var(--a),var(--b))}
.item{border:1px solid var(--bd);border-radius:16px;padding:14px;margin-bottom:12px;background:rgba(255,255,255,.03)}
.item .head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;gap:8px;flex-wrap:wrap}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.lg{font:700 .72rem 'Courier New',monospace;color:var(--b);letter-spacing:.1em}
.photo{width:160px;aspect-ratio:4/5;object-fit:cover;border-radius:18px;border:1px solid var(--bd);display:block;background:#111}
.note{font-size:.85rem;color:var(--mut);border-right:3px solid var(--a);padding:6px 12px;margin:10px 0}
#dirty{color:var(--c);font-size:.85rem}
@media(max-width:640px){.grid3,.grid2{grid-template-columns:1fr}}
</style>
</head>
